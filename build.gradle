plugins {
    id 'java'
}

group 'org.example'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation 'org.hibernate.javax.persistence:hibernate-jpa-2.1-api:1.0.2.Final'
    implementation 'org.hibernate.models:hibernate-models:1.0.1'
    implementation 'org.hibernate.orm:hibernate-core:7.2.3.Final'
    implementation platform('org.hibernate.search:hibernate-search-bom:8.4.0.Final')
    implementation 'org.hibernate.search:hibernate-search-mapper-orm'
    // Note that for large-scale applications Gemini recommends Elasticsearch
    implementation 'org.hibernate.search:hibernate-search-backend-lucene'
    // Required for querying the DB
    implementation 'org.hibernate.search:hibernate-search-mapper-pojo-base'
    implementation 'org.postgresql:postgresql:42.7.14'
    implementation platform('org.apache.logging.log4j:log4j-bom:2.26.1')
    implementation 'org.apache.logging.log4j:log4j-core'
    implementation 'org.apache.logging.log4j:log4j-api'
    testImplementation 'org.junit.jupiter:junit-jupiter-engine:5.3.1'
}

test {
    useJUnitPlatform()
}
